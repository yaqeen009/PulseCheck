# nginx configuration for the PulseCheck web app (production container).
#
# The SPA is served from disk; API traffic is proxied to the `api` service so
# the browser only ever talks to one origin. That keeps the session cookie
# same-site and avoids CORS entirely.

upstream pulsecheck_api {
    server api:4100;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entry document or the service worker.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed asset filenames can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://pulsecheck_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://pulsecheck_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # Client-side routing: unknown paths render the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline hardening.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
}
